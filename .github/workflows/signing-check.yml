name: Signing check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Env
        run: |
          echo "HOME=$HOME ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset} ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-unset}"
          ls -la ~/.android 2>/dev/null || echo "no ~/.android"
      - name: Keystore from secret
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          echo "secret length: ${#DEBUG_KEYSTORE_B64}"
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          ls -la ~/.android
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "Alias|SHA256|Owner" || echo "KEYTOOL FAILED"
      - name: Build both and print certs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -q
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "== $f"; $BT/apksigner verify --print-certs "$f" | grep -E "SHA-256|DN"
          done
          ls -la ~/.android
      - name: Published release cert
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download v1.1.0+2 -p budget.apk -R "$GITHUB_REPOSITORY" -O pub.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs pub.apk | grep -E "SHA-256|DN"
      - name: First debug artifact cert (run 41961903370)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh run download 41961903370 -n budget-debug-apk -D first -R "$GITHUB_REPOSITORY" || { echo "artifact gone"; exit 0; }
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs first/*.apk | grep -E "SHA-256|DN"
