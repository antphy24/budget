name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sign with YOUR debug key, so the APK installs over the app on your
      # phone as an update (a different key would force an uninstall = data loss).
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret missing — the APK would not install over the app"; exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/budget.keystore"
          echo "BUDGET_KEYSTORE=$RUNNER_TEMP/budget.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify the APK is signed with your key
        run: |
          want=$(keytool -list -v -keystore "$BUDGET_KEYSTORE" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          got=$($BT/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "key: $want"; echo "apk: $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::APK is not signed with your key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: budget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
